<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Tennis</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
    touch-action: none;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background: url('court.png') center/cover no-repeat;
  }
  #score {
    position: fixed;
    top: env(safe-area-inset-top, 15px);
    left: 15px;
    color: #fff;
    font-size: 24px;
    font-family: monospace;
    text-shadow: 2px 2px 2px #000;
    z-index: 10;
  }
  #jumpBtn {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 20px);
    right: 20px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    border: 2px solid white;
    color: white;
    font-size: 24px;
    text-align: center;
    line-height: 80px;
    font-family: monospace;
    user-select: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="score">Очки: 0</div>
<div id="jumpBtn">↑</div>
<canvas id="game" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let score = 0;
let girlImg = new Image();
let girlAlt = new Image();
let boyImg = new Image();
let bbbImg = new Image();
let flame = new Image();

girlImg.src = 'g1.jpg';
girlAlt.src = 'g2.jpg';
boyImg.src = 'b1.jpg';
bbbImg.src = 'bbb1.jpg';
flame.src = 'flame.png';

let girl = { x: 400, y: 200, w: 70, h: 70 }; // уменьшено в 2 раза
let boy = { x: 400, y: 450, w: 70, h: 70 };  // уменьшено в 2 раза
let jumping = false;
let jumpHeight = 0;
let showFlame = false;
let showBBB = false;
let girlImageCurrent = girlImg;

function resetGirl() {
  girl.x = Math.random() * (canvas.width - girl.w);
  girl.y = Math.random() * (canvas.height - 200);
}

resetGirl();

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // девочка
  ctx.drawImage(girlImageCurrent, girl.x, girl.y, girl.w, girl.h);

  // парень
  ctx.drawImage(boyImg, boy.x, boy.y - jumpHeight, boy.w, boy.h);

  // если очко
  if (showFlame) {
    ctx.drawImage(flame, boy.x + boy.w / 2 - 15, boy.y - 50, 30, 30);
  }

  // картинка bbb1
  if (showBBB) {
    ctx.drawImage(bbbImg, girl.x + girl.w / 2 - 19, girl.y - 39, 39, 39);
  }

  requestAnimationFrame(draw);
}
draw();

function updateScore() {
  score++;
  document.getElementById('score').textContent = 'Очки: ' + score;
}

function jump() {
  if (jumping) return;
  jumping = true;
  let up = true;
  let jumpInterval = setInterval(() => {
    if (up) {
      jumpHeight += 10;
      if (jumpHeight >= 60) up = false;
    } else {
      jumpHeight -= 10;
      if (jumpHeight <= 0) {
        clearInterval(jumpInterval);
        jumping = false;
      }
    }
  }, 30);

  // проверяем столкновение
  if (
    Math.abs((boy.x + boy.w/2) - (girl.x + girl.w/2)) < 50 &&
    Math.abs((boy.y + boy.h/2) - (girl.y + girl.h/2)) < 50
  ) {
    updateScore();
    showFlame = true;
    girlImageCurrent = girlAlt;
    showBBB = true;

    setTimeout(() => {
      showFlame = false;
      showBBB = false;
      girlImageCurrent = girlImg;
      resetGirl();
    }, 1000);
  }
}

// движение девочки
setInterval(() => {
  girl.x += (Math.random() - 0.5) * 40;
  girl.y += (Math.random() - 0.5) * 40;
  girl.x = Math.max(0, Math.min(canvas.width - girl.w, girl.x));
  girl.y = Math.max(0, Math.min(canvas.height - 200, girl.y));
}, 500);

// управление пальцем (тач)
let touchStartX = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
});
document.addEventListener('touchmove', e => {
  let deltaX = e.touches[0].clientX - touchStartX;
  boy.x += deltaX * 0.3;
  touchStartX = e.touches[0].clientX;
});
document.getElementById('jumpBtn').addEventListener('touchstart', jump);

// управление мышью (для теста на ПК)
document.addEventListener('mousemove', e => {
  boy.x = e.clientX - boy.w / 2;
});
document.addEventListener('click', jump);
</script>
</body>
</html>
