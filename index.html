<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Pixel Tennis — Responsive</title>
<style>
  :root{
    --hud-padding: 12px;
    --jump-size: 64px;
  }
  html,body{
    height:100%;
    margin:0;
    background:#0b2e18;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    -ms-user-select:none;
    user-select:none;
    overflow:hidden;
  }
  /* wrapper occupies full viewport but we keep some padding for safe-area and HUD */
  #wrap{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
    padding: env(safe-area-inset-top,12px) env(safe-area-inset-right,12px) env(safe-area-inset-bottom,12px) env(safe-area-inset-left,12px);
  }

  /* canvas is drawn at a fixed internal resolution, but CSS-scaled to fit viewport */
  canvas{
    image-rendering: pixelated;
    background: transparent;
    display:block;
    max-width:100%;
    max-height:100%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    border-radius:10px;
  }

  /* HUD and button fixed on top of canvas */
  #hud{
    position: absolute;
    left: calc(var(--hud-padding));
    top: calc(var(--hud-padding));
    z-index:20;
    font-family: monospace;
    color: #fff;
    background: rgba(0,0,0,0.35);
    padding: 8px 12px;
    border-radius:8px;
    font-size:16px;
    text-shadow:0 1px 0 #000;
  }

  #jumpBtn{
    position:absolute;
    right: calc(var(--hud-padding));
    bottom: calc(var(--hud-padding));
    z-index:20;
    width: var(--jump-size);
    height: var(--jump-size);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.08);
    color:#fff;
    font-family:monospace;
    font-weight:700;
    user-select:none;
    -webkit-user-select:none;
    touch-action: none;
  }

  /* ensure small screens look good */
  @media (max-width:420px){
    :root{ --jump-size:56px; }
    #hud{ font-size:14px; padding:6px 10px; }
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="hud">Очки: <span id="score">0</span></div>
    <div id="jumpBtn" role="button" aria-label="jump">JUMP</div>
  </div>

<script>

 Key changes:

 - Pointer-based dragging moves player full 2D across the playable area.
 - Scoring/overlay logic doesn't block further play.
*/
